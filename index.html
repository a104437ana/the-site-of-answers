<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Site of Answers</title>
  <link rel="preload" as="image" href="space.jpg">
  <link rel="preload" as="image" href="owl.gif">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background-image: url('space.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
    }

    .bar {
      position: absolute;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 24px;
    }

    .bar-top { top: 10px; }
    .bar-bottom { bottom: 10px; }

    .view {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.5s ease;
    }

    .view.visible {
      opacity: 1;
      visibility: visible;
    }

    .view h1 {
      font-size: 80px;
      margin: 0;
    }

    #ask-btn, #back-btn {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    #ask-btn {
      background: none;
      border: none;
      color: white;
      font-size: 80px;
      font-family: inherit;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
      margin-top: 20px;
    }

    #back-btn {
      background: none;
      border: none;
      color: white;
      font-size: 56px;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
      margin-top: 30px;
    }
  </style>
</head>
<body style="opacity:0; transition: opacity 1s; margin: 0; height: 100vh;">
  <div class="bar bar-top"><b>The Site of Answers</b></div>

  <div id="question-view" class="view visible">
    <img src="owl.gif" style="height: 200px; margin-top: -164px;" alt="Owl">
    <h1>Ask a yes-or-no question</h1>
    <button id="ask-btn">Get the answer</button>
  </div>

  <div id="answer-view" class="view">
    <h1 id="answer"></h1>
    <button id="back-btn">Try again</button>
  </div>

  <div class="bar bar-bottom"><b>The Site of Answers</b></div>

  <script>
    const questionView = document.getElementById('question-view');
    const answerView = document.getElementById('answer-view');
    const answerEl = document.getElementById('answer');

    document.getElementById('ask-btn').addEventListener('click', () => {
      answerEl.textContent = Math.random() < 0.5 ? 'Yes' : 'No';
      questionView.classList.remove('visible');
      answerView.classList.add('visible');
    });

    document.getElementById('back-btn').addEventListener('click', () => {
      answerView.classList.remove('visible');
      questionView.classList.add('visible');
    });

    window.addEventListener('load', () => {
      document.body.style.opacity = '1';
    });
  </script>
</body>
</html>
